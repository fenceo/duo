name: Publish Windows release

on:
  push:
    branches:
      - 'release/v*'
      - 'review/ui-*'

permissions:
  contents: read

concurrency:
  group: duo-stable-release
  cancel-in-progress: false

jobs:
  review-knowledge:
    if: github.repository == 'fenceo/duo' && startsWith(github.ref, 'refs/heads/review/ui-')
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check knowledge and file synchronization in an isolated Windows runner
        run: |
          node scripts/Prepare-Release-CI.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Temporary directory preparation failed.' }
      - name: Run knowledge regressions
        run: |
          node scripts/Check-Knowledge-CI.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge regression failed.' }
  review-ui:
    if: github.repository == 'fenceo/duo' && startsWith(github.ref, 'refs/heads/review/ui-')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked test dependencies
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Capture synthetic desktop and phone layouts
        if: ${{ !cancelled() }}
        run: |
          node scripts/Capture-Conversation-UI.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Conversation geometry checks failed.' }
      - name: Publish only synthetic preview images and measurements
        if: always()
        run: |
          if (!(Test-Path -LiteralPath 'build/ui-review/geometry.json')) { return }
          if ($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Unexpected source commit.' }
          $previewBranch = 'ui-snapshots/' + $env:GITHUB_SHA
          git ls-remote --exit-code --heads origin ('refs/heads/' + $previewBranch) | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Output 'This source already has a preview branch.'; exit 0 }
          git switch --orphan $previewBranch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the isolated preview branch.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'build/ui-review/geometry.json'
          Get-ChildItem -LiteralPath 'build/ui-review' -Filter '*.png' -File | ForEach-Object { git add -- $_.FullName }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage preview files.' }
          git commit -m ('UI preview for ' + $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit preview files.' }
          git push origin $previewBranch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish the synthetic preview.' }
  publish:
    if: github.repository == 'fenceo/duo' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate the release branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or $env:RELEASE_BRANCH -cne ('release/v' + $version)) {
            throw 'Release branch must match the stable version in package.json.'
          }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout differs from the pushed commit.' }
          git switch -c $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the named release branch.' }
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure the release tag author.' }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure the release tag email.' }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Use a physical temporary directory for security fixtures
        run: |
          node .\scripts\Prepare-Release-CI.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare an ordinary temporary directory.' }

      - name: Reuse the prepared Go environment during packaging
        run: |
          $goEnvironment = go env -json GOCACHE GOPATH | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the prepared Go environment.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value ('GOCACHE=' + $goEnvironment.GOCACHE)
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value ('GOPATH=' + $goEnvironment.GOPATH)

      - name: Install locked web dependencies
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { throw 'Web dependency installation failed.' }

      - name: Prepare the verified Inno Setup compiler
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\scripts\Setup-InnoToolchain.ps1

      - name: Check Go code
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed.' }

      - name: Test, build and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .\scripts\Publish-Release-CI.mjs
